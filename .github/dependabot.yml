# Dependabot configuration.
#
# Version updates for GitHub Actions and npm. Both are monthly and grouped into
# one PR each: the release workflow cuts a release from commit messages on merge,
# so a stream of single-package bump PRs is noise.
#
# The `ci` and `chore` prefixes keep these out of the release: neither type
# bumps the version (see the Versioning section of CLAUDE.md). A dependency
# bump that users must receive is promoted to `fix:` by hand.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    # Skip releases younger than 7 days: a freshly published (possibly
    # compromised) version is not proposed until it has had time to be caught.
    # Security updates ignore cooldown.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'ci'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # TypeScript majors change tsconfig defaults and options (6.0 deprecated
      # `baseUrl`, 7.0 is the native-compiler rewrite) and tsdown/rolldown-plugin-dts
      # pin the supported range. Migrate on purpose, not through a bump PR.
      # rolldown-plugin-dts peers `typescript ~7.0.0`, so a 7.1 bump breaks
      # installs; minors need the same deliberate migration.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # marked-terminal 7.3.0 (the latest release) declares a peer of
      # `marked >=1 <16`, so `npm ci` fails on marked 16+. Revisit once
      # marked-terminal publishes a release that supports newer marked.
      - dependency-name: 'marked'
        update-types: ['version-update:semver-major']
    groups:
      # Vitest and its @vitest/* packages pin exact peers on each other, so a
      # bump of one without the others installs two Vitest majors side by side.
      # Group them, majors included, ahead of npm-minor-patch (Dependabot puts a
      # dependency in the first group that matches it).
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      # Minor/patch only: majors (the AI SDK 7 move, for example) need a human
      # decision and their own PR.
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
    commit-message:
      prefix: 'chore'
      include: 'scope'
