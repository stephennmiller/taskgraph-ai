name: Workflow Lint

# Lints the workflows themselves: actionlint (syntax, expression and shellcheck
# errors) and zizmor (injection, excessive permissions, credential persistence,
# unpinned refs). ADVISORY and path-filtered, so it is deliberately NOT a
# required check -- a required check behind a path filter would sit Pending
# forever on every PR that does not touch .github/.
#
# Existing workflows predate this check and carry findings (floating action
# tags, missing persist-credentials: false, shellcheck notes). Annotations on
# those are expected until they are cleaned up separately; this workflow's job
# is to keep NEW workflow changes honest.
#
# The repo has no GitHub Advanced Security, so zizmor reports via annotations
# (advanced-security: false) instead of uploading SARIF.
#
# zizmor's own version rides on the pinned action (it carries hash-locked
# wheels), so Dependabot bumping the `uses:` SHA is the only upgrade path.
# Known gap: ACTIONLINT_VERSION and its sha256 are bumped by hand (Dependabot
# only tracks the `uses:` pins). Bump the sha256 from the release's
# actionlint_<version>_checksums.txt.
on:
  pull_request:
    paths:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' # actionlint_1.7.12_linux_amd64.tar.gz

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint (sha256-verified)
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      - name: Run actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'

  # Every job must set timeout-minutes (an unset one defaults to 6 hours). Needs
  # js-yaml, hence `npm ci`; --ignore-scripts skips husky's `prepare`.
  job-timeouts:
    name: job timeouts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check every job sets timeout-minutes
        run: node .github/scripts/check-job-timeouts.mjs

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@f9597c869b2e67095f9b527070297a13a6efe928 # v0.7.0
        with:
          inputs: .github
          config: .github/zizmor.yml
          advanced-security: false
          annotations: true
