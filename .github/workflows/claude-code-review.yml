name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# No workflow-level grant: the job below declares exactly what it needs.
# A skipped job never starts a runner, so CLAUDE_CODE_OAUTH_TOKEN is not
# mounted for a fork or an untrusted author.
permissions: {}

jobs:
  claude-review:
    # Same-repository pull requests from a trusted human only. A fork
    # pull_request checks out the fork's code; that must not run in a job
    # that holds the OAuth token. Dependabot is a bot on this repository
    # and is outside the association allowlist, so it stays excluded.
    # The prompt below interpolates the repository name and PR number only.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)

    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout. Review comments use the action's app token
      pull-requests: read
      id-token: write # OIDC exchange for the Claude GitHub App token

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

