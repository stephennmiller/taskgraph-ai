name: CI

on:
  push:
    branches:
      - main
      - next
  pull_request:
  # The merge queue runs the required checks on each group before it merges
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DO_NOT_TRACK: 1
  NODE_ENV: development
  NODE_VERSION: 24

jobs:
  # Single install job that caches node_modules for all other jobs
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Same npm as release and local development, so `npm ci` and the packed
      # install see npm 12's lockfile and install-script rules.
      - name: Update npm
        run: npm install -g npm@12.2.1

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-v3-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        timeout-minutes: 5

  # Fast checks that can run in parallel
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-v3-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        timeout-minutes: 5

      - name: Format Check
        run: npm run format-check
        env:
          FORCE_COLOR: 1

  typecheck:
    name: Typecheck
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-v3-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        id: install-typecheck
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        timeout-minutes: 5

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-typecheck-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-typecheck-

      - name: Typecheck
        run: npm run turbo:typecheck
        env:
          FORCE_COLOR: 1

      # The only check that reads scripts/dev.js (allowJs + strict) and evals/,
      # which no workspace typecheck covers
      - name: Typecheck scripts and evals
        if: ${{ !cancelled() && steps.install-typecheck.outcome != 'failure' }}
        run: npm run typecheck:root

  # Fails when a change leaves files, exports or dependencies unused.
  # Config and allowlist: knip.jsonc
  knip:
    name: Unused Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-v3-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        timeout-minutes: 5

      # Builds @tm/build-config first: knip loads tsdown.config.ts, which imports it
      - name: Find unused code
        run: npm run knip
        env:
          FORCE_COLOR: 1

  # Build job to ensure everything compiles
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-v3-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        timeout-minutes: 5

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-build-

      - name: Build
        run: npm run turbo:build
        env:
          NODE_ENV: production
          FORCE_COLOR: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-artifacts
          path: dist/
          retention-days: 1

  test:
    name: Test
    # The suites take about 14 minutes, most of it the @tm/cli integration
    # tests that spawn the built CLI. A job that hits this limit shows as
    # cancelled, not failed, so leave a wide margin.
    timeout-minutes: 25
    runs-on: ubuntu-latest
    needs: [build, parity-changes]
    # parity-changes is skipped on push, so don't let that skip this job
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-v3-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        timeout-minutes: 5

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-artifacts
          path: dist/

      - name: Run Tests
        run: |
          npm run test:coverage -- --maxWorkers=2
        env:
          NODE_ENV: test
          CI: true

      - name: Run @tm/profiles tests
        run: npm run test -w @tm/profiles
        env:
          NODE_ENV: test
          CI: true

      # 80% thresholds in packages/tm-core/vitest.config.ts apply only when
      # coverage is on. Plain `npm run test` leaves it off (#259); this step
      # runs test:coverage so a drop below 80% fails the job (#711).
      - name: Run @tm/core tests
        if: ${{ !cancelled() && needs.parity-changes.outputs.code != 'false' }}
        run: npm run test:coverage -w @tm/core
        env:
          NODE_ENV: test
          CI: true

      - name: Run @tm/cli tests
        if: ${{ !cancelled() && needs.parity-changes.outputs.code != 'false' }}
        run: npm run test -w @tm/cli
        env:
          NODE_ENV: test
          CI: true

      - name: Run @tm/mcp tests
        if: ${{ !cancelled() && needs.parity-changes.outputs.code != 'false' }}
        run: npm run test -w @tm/mcp
        env:
          NODE_ENV: test
          CI: true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: |
            test-results
            coverage
            junit.xml
          retention-days: 30

  # Fails when the built CLI starts slower than its budget (#248): an agent
  # runs taskgraph dozens of times a session. Budgets and the fixture are in
  # .github/scripts/check-startup-time.mjs.
  startup-time:
    name: Startup Time
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, parity-changes]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.parity-changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-v3-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        timeout-minutes: 5

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-artifacts
          path: dist/

      - name: Check startup time
        run: node .github/scripts/check-startup-time.mjs dist/taskgraph.js 9

  # The full suites above run on ubuntu only. This builds on each OS, then runs,
  # on Node 24 and on the oldest Node that `engines` allows, the CLI smoke tests (the
  # @tm/cli integration tests that spawn the built CLI for the everyday
  # commands; list in apps/cli/package.json "test:smoke") and the MCP stdio
  # smoke test, including the AI-path tests that run the fake `claude`.
  smoke:
    name: Smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: parity-changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24"]
        include:
          - os: ubuntu-latest
            node: "22.19.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Build on the repo's Node (.nvmrc): tsdown itself needs Node 22.18 or
      # later. The tests below then run on matrix.node, which is what
      # `engines` promises users of the built package.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: ${{ needs.parity-changes.outputs.code != 'false' }}
        run: npm ci
        timeout-minutes: 10

      - name: Build
        if: ${{ needs.parity-changes.outputs.code != 'false' }}
        run: npm run build
        env:
          NODE_ENV: production

      - name: Switch to Node ${{ matrix.node }}
        if: ${{ matrix.node != env.NODE_VERSION && needs.parity-changes.outputs.code != 'false' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: CLI smoke tests
        if: ${{ needs.parity-changes.outputs.code != 'false' }}
        run: npm run test:smoke -w @tm/cli
        env:
          NODE_ENV: test
          CI: true

      - name: MCP smoke test
        if: ${{ !cancelled() && needs.parity-changes.outputs.code != 'false' }}
        run: npm run smoke:mcp

      # With a log level set, a tm-core logger built before TASKGRAPH_MCP was set
      # printed to stdout. get_tasks logs that no complexity report exists (#612).
      - name: MCP smoke test with debug logging
        if: ${{ !cancelled() && needs.parity-changes.outputs.code != 'false' }}
        # node prints the cwd as JSON, so Windows paths keep their backslashes escaped
        run: npm run smoke:mcp -- --call get_tasks --args "{\"projectRoot\":$(node -p 'JSON.stringify(process.cwd())')}"
        env:
          TASKGRAPH_LOG_LEVEL: debug

  # Installs the tarball `npm pack` makes, as a user would get it from the
  # registry, and runs the CLI from it. Catches a file missing from "files",
  # a broken bin or an install over the size budget before release.
  pack:
    name: Packed tarball
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, parity-changes]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.parity-changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Update npm
        run: npm install -g npm@12.2.1

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-artifacts
          path: dist/

      - name: Install, size-check and run the packed CLI
        run: .github/scripts/pack-smoke.sh

  # Does this PR touch what the build comparison covers: the code bundled into
  # dist/, the files init copies, the dependencies, or the comparison itself?
  # Cheap, so the heavy job below is skipped for docs and test-only changes.
  # The patterns are in .github/scripts/parity-paths.txt.
  # `code` adds .github/scripts/test-paths.txt, what the workspace suites, Smoke,
  # Startup Time and Packed tarball read; when false (docs, CI-only, root
  # tests/) those are skipped. They gate on != 'false', so a push, where this
  # job is skipped, or a failure here runs them all.
  parity-changes:
    name: Parity changes
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changed.outputs.run }}
      code: ${{ steps.changed.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changes under the compared code
        id: changed
        env:
          BASE_REV: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
        run: |
          # -z: names unquoted, so a non-ASCII path still matches its pattern;
          # --no-renames: a file moved out of a covered folder counts too
          git diff -z --no-renames --name-only "${BASE_REV}...HEAD" > changed-files.txt
          # grep exits 1 for no match; anything else (a missing or bad pattern
          # file) must fail the job rather than skip the comparison
          code=0
          grep -zEqf .github/scripts/parity-paths.txt changed-files.txt || code=$?
          case $code in
          0) echo "run=true" >> "$GITHUB_OUTPUT" ;;
          1) echo "run=false" >> "$GITHUB_OUTPUT" ;;
          *) exit "$code" ;;
          esac
          code=0
          grep -zEq -f .github/scripts/parity-paths.txt -f .github/scripts/test-paths.txt changed-files.txt || code=$?
          case $code in
          0) echo "code=true" >> "$GITHUB_OUTPUT" ;;
          1) echo "code=false" >> "$GITHUB_OUTPUT" ;;
          *) exit "$code" ;;
          esac

  # Runs the scripted CLI and MCP scenarios on the target branch's build and on
  # this PR's build and reports where they differ. Informational: a difference is
  # shown in the job summary and does not fail the PR. Only a scenario that
  # cannot run fails the job.
  parity:
    name: Parity
    needs: [build, parity-changes]
    if: needs.parity-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out the target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: base
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: base/package-lock.json

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-v3-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        timeout-minutes: 5

      - name: Download this PR's build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-artifacts
          path: dist/

      # Its own install, so a lockfile change in the PR cannot make the target
      # branch's build run on this PR's dependencies
      - name: Install the target branch
        working-directory: base
        run: npm ci
        timeout-minutes: 5

      - name: Build the target branch
        working-directory: base
        run: npm run turbo:build
        env:
          NODE_ENV: production
        timeout-minutes: 10

      - name: Compare the builds
        run: .github/scripts/run-parity.sh base . parity-reports

      - name: Upload comparison reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: parity-reports
          path: parity-reports
          retention-days: 7
