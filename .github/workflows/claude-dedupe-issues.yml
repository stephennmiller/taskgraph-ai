name: Claude Issue Dedupe
# description: Automatically dedupe GitHub issues using Claude Code

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process for duplicate detection"
        required: true
        type: string

jobs:
  claude-dedupe-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Claude Code slash command
        # A mirror of claude-code-action's base-action directory. This commit is
        # the sync of claude-code-action f27be6b, the v1.0.252 that claude.yml
        # pins, so both workflows run the same source. The old pin (v0.0.63, from
        # August 2025) bundled a Claude Code whose default model has been retired.
        # Not claude-code-action itself: it refuses issue authors without write
        # access, and dedupe has to run on issues from outside reporters. The
        # mirror has no recent tags, so Dependabot cannot bump it. When it bumps
        # claude-code-action in claude.yml, move this pin to the matching
        # "Sync from claude-code-action base-action@<sha>" commit by hand.
        uses: anthropics/claude-code-base-action@835599743d81c7a5d303d2abace46bbb5bebcb58 # mirror of claude-code-action v1.0.252
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prompt: "/dedupe ${{ github.repository }}/issues/${{ github.event.issue.number || inputs.issue_number }}"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --model claude-sonnet-5-5
