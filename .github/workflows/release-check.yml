name: Release Check

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

concurrency:
  # head_ref is empty for merge_group; each queue group has its own ref
  group: release-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job id is the required status check `check-release-mode` on main.
  # Renaming it would leave that rule waiting on a check that never reports.
  # The script parses workflow YAML with js-yaml, hence `npm ci`.
  # --ignore-scripts skips the prepare hook.
  check-release-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check release config
        run: node ./.github/scripts/check-release-config.mjs
