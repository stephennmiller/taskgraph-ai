name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# No workflow-level grant: the job below declares exactly what it needs.
# A skipped job never starts a runner, so CLAUDE_CODE_OAUTH_TOKEN is not
# mounted for an event that fails the actor check.
permissions: {}

jobs:
  claude:
    # Trusted human actors only, and only when they mentioned @claude.
    # The action's write check runs after the runner already has the token,
    # so it cannot be the only gate. Association is the commenter, reviewer,
    # or issue author (OWNER covers the repository owner). Assigning someone
    # else's issue carries no actor association, so that path is limited to
    # the repository owner. Bots are excluded so a Claude reply cannot
    # start another run. Comment text is not interpolated into a run step.
    if: |
      github.event.sender.type != 'Bot' &&
      (
        (
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        ) ||
        (
          github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
        ) ||
        (
          github.event_name == 'issues' &&
          (
            contains(github.event.issue.body, '@claude') ||
            contains(github.event.issue.title, '@claude')
          ) &&
          (
            contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
            (github.event.action == 'assigned' && github.actor == github.repository_owner)
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout. Git writes use the action's app token, not this token
      pull-requests: read
      issues: read
      id-token: write # OIDC exchange for the Claude GitHub App token
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

