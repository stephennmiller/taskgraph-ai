name: Gitleaks

# History-aware secret scan, a required check on main. No paid secrets: it
# runs the open-source gitleaks CLI, not gitleaks-action (which needs a license
# key for organisation repos). The binary is pinned by version and verified
# against a sha256 before it is extracted.
#
# Scans the full history of HEAD only (fetch-depth: 0 plus --log-opts HEAD; on a
# PR, HEAD is the merge commit, so main + this PR). Without --log-opts gitleaks
# runs `git log --all`, which would scan every other open branch too.
#
# Findings that already existed when this workflow was added are in
# config/security/gitleaks-baseline.json (Match/Secret are redacted); only NEW
# findings fail. Eleven are obvious placeholders and localhost curl examples.
# Four (.cursor/mcp.json, April 2025, removed upstream) are full-length pplx-/
# sk-ant- strings; whether they were ever revoked is NOT verified. They sit in
# public upstream history and cannot be un-published by baselining or rewriting
# here. Regenerate the baseline deliberately, never to silence a fresh leak.
# The baseline MUST be generated with --redact: gitleaks skips the Secret/Match
# comparison only under --redact; without it the baseline matches nothing, all
# findings return and plaintext secrets are printed. Exact command:
#   gitleaks git . --log-opts="--full-history HEAD" --redact --no-banner \
#     --report-format json --report-path config/security/gitleaks-baseline.json
# Run it from an up-to-date main checkout with the GITLEAKS_VERSION pinned below,
# then `npx biome format --write config/security/gitleaks-baseline.json`: the
# repo's format check covers that file and gitleaks does not write Biome style
# (matching is on parsed fields, so reformatting is safe).
# Not tamper-proof: a PR can suppress its own finding by editing the baseline or
# this file, an inline gitleaks:allow, or a new .gitleaksignore/.gitleaks.toml.
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Bumping the version means regenerating the baseline with the new binary:
  # baseline matching is exact on every field (rule Description, Entropy), so a
  # release that rewords a rule turns all baselined findings into NEW ones.
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' # gitleaks_8.30.1_linux_x64.tar.gz

jobs:
  gitleaks:
    name: Gitleaks (history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan full history
        run: |
          ./gitleaks git . --log-opts="--full-history HEAD" --redact --no-banner \
            --baseline-path config/security/gitleaks-baseline.json \
            --report-format json --report-path gitleaks-report.json \
            --exit-code 1

      - name: Upload report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7
