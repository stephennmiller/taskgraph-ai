name: Version Bump

# Runs after CI passes on main. Bumps the version from conventional commits
# (feat -> minor, fix/perf/revert -> patch, "!" or BREAKING CHANGE -> major;
# one level lower below 1.0.0), commits the new version, tags it, creates a
# GitHub Release and stages the build on npm for a maintainer to approve.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Serialize runs but never cancel one mid-push.
concurrency:
  group: version-bump
  cancel-in-progress: false

# No workflow-level grant: each job declares exactly what it needs.
permissions: {}

jobs:
  bump:
    name: Bump version and release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the release commit and tag, create the GitHub Release
    steps:
      # main's ruleset requires PRs and the GitHub Actions app can't be a bypass
      # actor on a user-owned repo, so pushes use a fine-grained PAT owned by a
      # repo admin (the admin role is the ruleset's bypass actor).
      - name: Require RELEASE_TOKEN
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret is not set; the release push to main would be rejected."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0 # full history and tags to find the last release
          token: ${{ secrets.RELEASE_TOKEN }}

      # If main moved on, the newer commit's own CI run will cover these
      # commits too (the bump range is "last release tag..HEAD").
      - name: Skip if main has moved past the tested commit
        id: fresh
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$TESTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main moved past $TESTED_SHA; a newer run will release."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.fresh.outputs.current == 'true'
        with:
          node-version: 22

      - name: Compute and apply version bump
        id: bump
        if: steps.fresh.outputs.current == 'true'
        run: node ./.github/scripts/version-bump.mjs

      - name: Commit, tag and push
        if: steps.bump.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json packages/claude-code-plugin/.claude-plugin/plugin.json
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git tag "$TAG"
          # Atomic: either the commit and tag both land, or neither does.
          git push --atomic origin HEAD:main "$TAG"

      - name: Create GitHub Release
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
          BASELINE: ${{ steps.bump.outputs.baseline }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --latest \
            --title "$TAG" \
            --generate-notes \
            --notes-start-tag "$BASELINE"

    # Placed after the steps so the lines above keep the positions that
    # .github/zizmor.yml ignores by line number.
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      tag: ${{ steps.bump.outputs.tag }}

  # Uploads the tagged build to npm as a STAGED release. `npm stage publish`
  # defers proof-of-presence (2FA): nothing is installable until a maintainer
  # runs `npm stage approve <stage-id>` (list them with `npm stage list
  # taskgraph-ai`). Authenticates with npm trusted publishing (OIDC), so there
  # is no npm token. The trusted publisher on npmjs.com must name this file,
  # version-bump.yml, with no environment, and needs only the default "stage
  # publish" permission (leave "Allow npm publish" and "Allow npm dist-tag"
  # unchecked).
  publish:
    name: Stage npm release
    needs: bump
    if: needs.bump.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      # The tag this run just pushed, so the package is built from exactly the
      # version-bump commit and not from whatever main has moved on to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.bump.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Update npm for trusted publishing
        run: npm install -g npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stage release on npm
        run: npm stage publish
