name: Version Bump

# Runs after CI passes on main. Bumps the version from conventional commits
# (feat -> minor, fix/perf/revert -> patch, "!" or BREAKING CHANGE -> major;
# one level lower below 1.0.0), commits the new version, tags it, creates a
# GitHub Release and stages the build on npm for a maintainer to approve.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Serialize runs but never cancel one mid-push.
concurrency:
  group: version-bump
  cancel-in-progress: false

# No workflow-level grant: each job declares exactly what it needs.
permissions: {}

jobs:
  bump:
    name: Bump version and release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the release commit and tag, create the GitHub Release
    steps:
      # main's ruleset requires pull requests, and the GitHub Actions app
      # cannot be a bypass actor on a user-owned repo. Push as a GitHub App
      # that is on that bypass list. The private key only mints an installation
      # token (one hour, revoked when the job ends). Checkout persists that
      # token, and `git push` uses it. The token requests contents: write only.
      # Setup: a GitHub App with Contents read and write, installed on this
      # repo, listed on the main ruleset bypass list. Secrets:
      # RELEASE_APP_CLIENT_ID (the app's Client ID) and RELEASE_APP_PRIVATE_KEY
      # (its PEM private key).
      - name: Require release app credentials
        env:
          RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$RELEASE_APP_CLIENT_ID" ] || [ -z "$RELEASE_APP_PRIVATE_KEY" ]; then
            echo "::error::RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY must be set. The release push uses a short-lived GitHub App installation token."
            exit 1
          fi

      - name: Create release app token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0 # full history and tags to find the last release
          token: ${{ steps.release-token.outputs.token }}

      # If main moved on, the newer commit's own CI run will cover these
      # commits too (the bump range is "last release tag..HEAD").
      - name: Skip if main has moved past the tested commit
        id: fresh
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$TESTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main moved past $TESTED_SHA; a newer run will release."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.fresh.outputs.current == 'true'
        with:
          node-version: 22

      - name: Compute and apply version bump
        id: bump
        if: steps.fresh.outputs.current == 'true'
        run: node ./.github/scripts/version-bump.mjs

      - name: Commit, tag and push
        id: push
        if: steps.bump.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json packages/claude-code-plugin/.claude-plugin/plugin.json
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git tag "$TAG"
          .github/scripts/release-push.sh

      - name: Create GitHub Release
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
          BASELINE: ${{ steps.bump.outputs.baseline }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --latest \
            --title "$TAG" \
            --generate-notes \
            --notes-start-tag "$BASELINE"

    # Placed after the steps so the lines above keep the positions that
    # .github/zizmor.yml ignores by line number.
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      tag: ${{ steps.bump.outputs.tag }}

  # Uploads the tagged build to npm as a STAGED release. `npm stage publish`
  # defers proof-of-presence (2FA): nothing is installable until a maintainer
  # runs `npm stage approve <stage-id>` (list them with `npm stage list
  # taskgraph-ai`). Authenticates with npm trusted publishing (OIDC), so there
  # is no npm token. The trusted publisher on npmjs.com must name this file,
  # version-bump.yml, with no environment, and needs only the default "stage
  # publish" permission (leave "Allow npm publish" and "Allow npm dist-tag"
  # unchecked).
  publish:
    name: Stage npm release
    needs: bump
    if: needs.bump.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      # The tag this run just pushed, so the package is built from exactly the
      # version-bump commit and not from whatever main has moved on to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.bump.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Update npm for trusted publishing
        run: npm install -g npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stage release on npm
        run: npm stage publish
