# zizmor config. Each ignore below is a triaged finding, not a suppression of
# something unread: the reason is stated so the next audit does not re-litigate it.
#
# Entries are `file:line` so a NEW finding of the same rule in the same file still
# surfaces. The trade-off: editing one of these files above the ignored line shifts
# it and re-surfaces the finding. Re-triage it and update the line here.
rules:
  artipacked:
    ignore:
      # These jobs push with the credentials `actions/checkout` persists, so
      # `persist-credentials: false` would break them.
      # Checks out with the short-lived release app token and runs
      # `git push --atomic origin HEAD:main <tag>`.
      - version-bump.yml:57
      # The Claude action workflows. Their checkout feeds an action that does its own
      # git operations, and edits to them cannot be tested end to end before merge
      # (the action is expected to refuse a workflow file that differs from the
      # default branch's copy). Left alone deliberately; revisit if that changes.
      - claude.yml:28
      - claude-dedupe-issues.yml:23
  dangerous-triggers:
    ignore:
      # `issue_comment` is needed to answer "@claude" comments. The job only runs when
      # the body contains "@claude", and claude-code-action refuses any actor without
      # write access to the repo (checkWritePermissions; `allowed_non_write_users` is
      # not set here). The comment text is never interpolated into a `run:` script.
      - claude.yml:4
      # `workflow_run` is needed to release only after CI passes on main. The job is
      # gated on `workflow_run.conclusion == 'success'` and `workflow_run.event == 'push'`
      # with `branches: [main]`, checks out `main` (not the triggering run's head), and
      # fails early if the release app credentials are unset. No PR-controlled code is checked out or run.
      # The publish job checks out the release tag this run pushed, never PR code, and
      # has no secrets: it authenticates to npm with OIDC trusted publishing.
      - version-bump.yml:8
  adhoc-packages:
    ignore:
      # Installed from the registry at an exact version, in the job that stages
      # the npm release. The npm CLI must be upgraded outside the lockfile for
      # trusted publishing. Bump it by hand when updating the release flow.
      - version-bump.yml:155
      # Same exact npm, in the job that moves the `latest` dist-tag over OIDC.
      - npm-dist-tag.yml:41
      # CI installs and packs with the same npm as release, at the same exact version.
      - ci.yml:44
      - ci.yml:456
