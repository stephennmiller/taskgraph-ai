<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d"><title id="t">How TaskGraph works</title><desc id="d">/tm:parse-prd turns your PRD into a task graph stored in .taskgraph/tasks/tasks.json in your repo. Each Claude Code session reads and updates that file, so a new session picks up the next task and the notes from the last one.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8A96AE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#8A96AE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>
.h{font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#0B1B3A} .acc{fill:#0077B6}
.s{font:400 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#56627A}
.code{font:500 12.5px 'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#0B1B3A} .sm{font-size:12px;fill:#56627A}
.lbl{font:500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#56627A} .mut{font-style:italic;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;font-size:12.5px}
</style><rect width="960" height="330" rx="16" fill="#FFFFFF"/><rect x="24" y="108" width="206" height="116" rx="14" fill="#F6F8FB" stroke="#D5DCE8" stroke-width="1.25"/><text x="44" y="140" class="h" text-anchor="start">Your PRD</text><text x="44" y="164" class="code" text-anchor="start">.taskgraph/docs/prd.md</text><text x="44" y="196" class="s" text-anchor="start">What you want built,</text><text x="44" y="214" class="s" text-anchor="start">in plain language</text><rect x="312" y="64" width="300" height="204" rx="16" fill="#E3F4FB" stroke="#7CCBE6" stroke-width="1.25"/><text x="334" y="98" class="h acc" text-anchor="start">The plan, in your repo</text><text x="334" y="122" class="code" text-anchor="start">.taskgraph/tasks/tasks.json</text><line x1="360" y1="176" x2="418" y2="152" stroke="#0077B6" stroke-width="2"/><line x1="360" y1="176" x2="418" y2="200" stroke="#0077B6" stroke-width="2"/><line x1="418" y1="152" x2="476" y2="152" stroke="#7CCBE6" stroke-width="2"/><line x1="418" y1="200" x2="476" y2="152" stroke="#7CCBE6" stroke-width="2"/><line x1="418" y1="200" x2="476" y2="200" stroke="#7CCBE6" stroke-width="2"/><line x1="476" y1="152" x2="534" y2="176" stroke="#7CCBE6" stroke-width="2"/><line x1="476" y1="200" x2="534" y2="176" stroke="#7CCBE6" stroke-width="2"/><circle cx="360" cy="176" r="9" fill="#0077B6"/><path d="M356 176 l2.6 2.6 l5 -5.4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="418" cy="152" r="9" fill="#0077B6"/><path d="M414 152 l2.6 2.6 l5 -5.4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="418" cy="200" r="9" fill="#0077B6"/><path d="M414 200 l2.6 2.6 l5 -5.4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="476" cy="152" r="9" fill="#FFFFFF" stroke="#0077B6" stroke-width="2.5"/><circle cx="476" cy="152" r="14" fill="none" stroke="#0077B6" stroke-opacity=".35" stroke-width="2"/><circle cx="476" cy="200" r="9" fill="#FFFFFF" stroke="#7CCBE6" stroke-width="2"/><circle cx="534" cy="176" r="9" fill="#FFFFFF" stroke="#7CCBE6" stroke-width="2"/><text x="334" y="240" class="s" text-anchor="start">Tasks, dependencies, status, notes.</text><text x="334" y="258" class="s" text-anchor="start">Committed alongside your code.</text><rect x="692" y="24" width="244" height="120" rx="14" fill="#FBEFEA" stroke="#EBC1B0" stroke-width="1.25"/><circle cx="714" cy="54" r="5" fill="#C15F3C"/><text x="726" y="59" class="h" text-anchor="start">Claude Code · Monday</text><text x="712" y="94" class="code sm" text-anchor="start">next-task → build →</text><text x="712" y="116" class="code sm" text-anchor="start">update-subtask → set-status</text><rect x="692" y="186" width="244" height="120" rx="14" fill="#FBEFEA" stroke="#EBC1B0" stroke-width="1.25"/><circle cx="714" cy="216" r="5" fill="#C15F3C"/><text x="726" y="221" class="h" text-anchor="start">Claude Code · Tuesday</text><text x="712" y="256" class="code sm" text-anchor="start">next-task → resumes with</text><text x="712" y="278" class="code sm" text-anchor="start">Monday’s notes</text><path d="M236 166 H304" fill="none" stroke="#8A96AE" stroke-width="1.6" marker-end="url(#ah)"/><text x="270" y="156" class="lbl" text-anchor="middle">parse-prd</text><path d="M620 84 H684" fill="none" stroke="#8A96AE" stroke-width="1.6" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="652" y="74" class="lbl" text-anchor="middle">read · write</text><path d="M620 246 H684" fill="none" stroke="#8A96AE" stroke-width="1.6" marker-end="url(#ah)"/><text x="652" y="236" class="lbl" text-anchor="middle">read</text><text x="814" y="170" class="lbl mut" text-anchor="middle">new session, same plan</text></svg>