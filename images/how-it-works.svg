<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 332" width="980" height="332" role="img" aria-labelledby="t d"><title id="t">How TaskGraph works</title><desc id="d">/taskgraph:parse-prd turns your PRD into a task graph stored in .taskgraph/tasks/tasks.json in your repo. Each Claude Code session reads and updates that file, so a new session picks up the next task and the notes from the last one.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8A96AE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#8A96AE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>
.h{font:600 17px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#0B1B3A} .acc{fill:#0077B6}
.s{font:400 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#56627A}
.code{font:500 13.5px 'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#0B1B3A}
.lbl{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#56627A} .cmd{font-family:'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:12.5px}
.mut{font-style:italic}
</style><rect width="980" height="332" rx="16" fill="#FFFFFF"/><rect x="24" y="104" width="232" height="124" rx="14" fill="#F6F8FB" stroke="#D5DCE8" stroke-width="1.25"/><text x="46" y="140" class="h" text-anchor="start">Your PRD</text><text x="46" y="166" class="code" text-anchor="start">.taskgraph/docs/prd.md</text><text x="46" y="198" class="s" text-anchor="start">What you want built,</text><text x="46" y="218" class="s" text-anchor="start">in plain language</text><rect x="336" y="56" width="300" height="220" rx="16" fill="#E3F4FB" stroke="#7CCBE6" stroke-width="1.25"/><text x="358" y="92" class="h acc" text-anchor="start">The plan, in your repo</text><text x="358" y="118" class="code" text-anchor="start">.taskgraph/tasks/tasks.json</text><line x1="384" y1="176" x2="442" y2="150" stroke="#0077B6" stroke-width="2"/><line x1="384" y1="176" x2="442" y2="202" stroke="#0077B6" stroke-width="2"/><line x1="442" y1="150" x2="500" y2="150" stroke="#7CCBE6" stroke-width="2"/><line x1="442" y1="202" x2="500" y2="150" stroke="#7CCBE6" stroke-width="2"/><line x1="442" y1="202" x2="500" y2="202" stroke="#7CCBE6" stroke-width="2"/><line x1="500" y1="150" x2="558" y2="176" stroke="#7CCBE6" stroke-width="2"/><line x1="500" y1="202" x2="558" y2="176" stroke="#7CCBE6" stroke-width="2"/><circle cx="384" cy="176" r="9" fill="#0077B6"/><path d="M380 176 l2.6 2.6 l5 -5.4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="442" cy="150" r="9" fill="#0077B6"/><path d="M438 150 l2.6 2.6 l5 -5.4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="442" cy="202" r="9" fill="#0077B6"/><path d="M438 202 l2.6 2.6 l5 -5.4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="500" cy="150" r="9" fill="#FFFFFF" stroke="#0077B6" stroke-width="2.5"/><circle cx="500" cy="150" r="14" fill="none" stroke="#0077B6" stroke-opacity=".35" stroke-width="2"/><circle cx="500" cy="202" r="9" fill="#FFFFFF" stroke="#7CCBE6" stroke-width="2"/><circle cx="558" cy="176" r="9" fill="#FFFFFF" stroke="#7CCBE6" stroke-width="2"/><text x="358" y="244" class="s" text-anchor="start">Tasks, dependencies, status, notes.</text><text x="358" y="264" class="s" text-anchor="start">Committed alongside your code.</text><rect x="716" y="20" width="240" height="120" rx="14" fill="#FBEFEA" stroke="#EBC1B0" stroke-width="1.25"/><circle cx="736" cy="52" r="5" fill="#C15F3C"/><text x="748" y="58" class="h" text-anchor="start">Claude Code · Monday</text><text x="736" y="92" class="s"><tspan class="code">/taskgraph:next</tspan>, then build</text><text x="736" y="116" class="s" text-anchor="start">Logs notes as it goes</text><rect x="716" y="192" width="240" height="120" rx="14" fill="#FBEFEA" stroke="#EBC1B0" stroke-width="1.25"/><circle cx="736" cy="224" r="5" fill="#C15F3C"/><text x="748" y="230" class="h" text-anchor="start">Claude Code · Tuesday</text><text x="736" y="264" class="s"><tspan class="code">/taskgraph:next</tspan>, new chat</text><text x="736" y="288" class="s" text-anchor="start">Picks up Monday’s notes</text><path d="M256 166 H328" fill="none" stroke="#8A96AE" stroke-width="1.6" marker-end="url(#ah)"/><text x="292" y="156" class="lbl cmd" text-anchor="middle">parse-prd</text><path d="M644 80 H708" fill="none" stroke="#8A96AE" stroke-width="1.6" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="676" y="70" class="lbl" text-anchor="middle">read · write</text><path d="M644 252 H708" fill="none" stroke="#8A96AE" stroke-width="1.6" marker-end="url(#ah)"/><text x="676" y="242" class="lbl" text-anchor="middle">read</text><text x="836" y="172" class="lbl mut" text-anchor="middle">new session, same plan</text></svg>